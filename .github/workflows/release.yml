name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore

    - name: Test
      run: dotnet test --configuration Release

    - name: Publish linux-x64
      run: dotnet publish -c Release -r linux-x64 --self-contained true -o ./dist/linux-x64

    - name: Publish win-x64
      run: dotnet publish -c Release -r win-x64 --self-contained true -o ./dist/win-x64

    - name: Archive artifacts
      run: |
        cd dist
        tar -czf binance-p2p-monitor-linux-x64.tar.gz linux-x64/
        zip -r binance-p2p-monitor-win-x64.zip win-x64/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          dist/binance-p2p-monitor-linux-x64.tar.gz
          dist/binance-p2p-monitor-win-x64.zip
